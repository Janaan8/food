name: Update bonusprijzen

on:
  schedule:
    - cron: "0 5 * * *" # dagelijks 05:00 UTC (07:00 NL zomertijd)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bonus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Haal bonusprijzen op
        run: python scripts/update_bonus.py

      - name: Commit bonus.json als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bonus.json
          git diff --cached --quiet && echo "Geen wijzigingen" && exit 0
          git commit -m "Bonusprijzen bijgewerkt"
          git push
